<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sous Chef</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #faf7f2;
        --warm-white: #fffdf9;
        --sage: #7a9e7e;
        --sage-light: #a3c4a8;
        --sage-dark: #5c7a60;
        --terracotta: #c96b4f;
        --terracotta-light: #e8a090;
        --terracotta-dark: #a55540;
        --charcoal: #2c2c2c;
        --warm-gray: #6b6560;
        --light-gray: #e8e3dc;
        --gold: #c9a96e;
        --gold-light: #e2c89a;
        --red-alert: #e04040;
        --green-ok: #4a9e5c;
        --blue-info: #5b8db8;
        
        --card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        --card-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--cream);
        color: var(--charcoal);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4 {
        font-family: "Playfair Display", serif;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--light-gray);
        border-radius: 10px;
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(122, 158, 126, 0.4); }
        70% { box-shadow: 0 0 0 12px rgba(122, 158, 126, 0); }
        100% { box-shadow: 0 0 0 0 rgba(122, 158, 126, 0); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .animate-fadeUp {
        animation: fadeUp 0.5s ease forwards;
      }

      .animate-fadeIn {
        animation: fadeIn 0.4s ease forwards;
      }

      .animate-spin-slow {
        animation: spin 1.2s linear infinite;
      }

      .animate-pulse-ring {
        animation: pulse-ring 2s infinite;
      }

      /* Print Styles */
      @media print {
        @page {
          margin: 1.5cm;
        }

        /* Reset all layout constraints that hide content */
        html, body, #root, .min-h-screen, main, .flex-1 {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          position: static !important;
          display: block !important;
          background-color: white !important;
        }

        /* Hide UI clutter */
        .no-print, nav, aside, button, .camera-capture, .flex-shrink-0 {
          display: none !important;
        }

        /* Force brand colors to print */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }

        /* Structure the printable area */
        main {
          padding: 0 !important;
          margin: 0 !important;
          max-width: none !important;
        }

        /* Ensure cards and grids don't get cut halfway */
        .rounded-2xl, .rounded-xl {
          break-inside: avoid;
          page-break-inside: avoid;
          border: 1px solid #eee !important;
          box-shadow: none !important;
          margin-bottom: 1rem;
        }

        /* Reset font sizes for better readability on paper */
        h1 { font-size: 24pt !important; }
        h2 { font-size: 20pt !important; }
        h3 { font-size: 16pt !important; }
        p, li, span { font-size: 11pt !important; line-height: 1.4 !important; }

        /* Remove animations that might start with 0 opacity */
        .animate-fadeUp, .animate-fadeIn {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",

    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
