<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sous Chef</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Vibrant Purple Theme */
        --cream: #f8f7ff;
        --warm-white: #ffffff;
        --sage: #7c3aed; /* Primary Purple */
        --sage-light: #a78bfa; /* Lavender */
        --sage-dark: #5b21b6; /* Deep Purple */
        --terracotta: #d946ef; /* Magenta Accent */
        --terracotta-light: #f0abfc;
        --terracotta-dark: #a21caf;
        --charcoal: #1e1b4b; /* Deep Indigo for text */
        --warm-gray: #6366f1; /* Indigo Gray */
        --light-gray: #e0e7ff; /* Light Periwinkle */
        --gold: #8b5cf6;
        --gold-light: #c4b5fd;
        --red-alert: #f43f5e;
        --green-ok: #10b981;
        --blue-info: #3b82f6;
        
        --card: 0 10px 25px -5px rgba(124, 58, 237, 0.1), 0 8px 10px -6px rgba(124, 58, 237, 0.1);
        --card-hover: 0 20px 25px -5px rgba(124, 58, 237, 0.2), 0 10px 10px -5px rgba(124, 58, 237, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--cream);
        color: var(--charcoal);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4 {
        font-family: "Playfair Display", serif;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--cream);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--sage-light);
        border-radius: 10px;
        border: 2px solid var(--cream);
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(124, 58, 237, 0); }
        100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .animate-fadeUp {
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-fadeIn {
        animation: fadeIn 0.5s ease forwards;
      }

      .animate-spin-slow {
        animation: spin 1.5s linear infinite;
      }

      .animate-pulse-ring {
        animation: pulse-ring 2.5s infinite;
      }

      /* Print Styles */
      @media print {
        @page {
          margin: 1.5cm;
        }

        html, body, #root, .min-h-screen, main, .flex-1 {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          position: static !important;
          display: block !important;
          background-color: white !important;
        }

        .no-print, nav, aside, button, .camera-capture, .flex-shrink-0 {
          display: none !important;
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }

        main {
          padding: 0 !important;
          margin: 0 !important;
          max-width: none !important;
        }

        .rounded-2xl, .rounded-xl {
          break-inside: avoid;
          page-break-inside: avoid;
          border: 1px solid #ddd !important;
          box-shadow: none !important;
          margin-bottom: 1rem;
        }

        h1 { font-size: 26pt !important; color: #5b21b6 !important; }
        h2 { font-size: 22pt !important; }
        h3 { font-size: 18pt !important; }
        p, li, span { font-size: 12pt !important; line-height: 1.5 !important; }

        .animate-fadeUp, .animate-fadeIn {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
