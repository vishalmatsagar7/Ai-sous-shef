<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sous Chef</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Enhanced Lush Purple Theme */
        --cream: #f4f2ff; /* Saturated Lavender Tint */
        --warm-white: #ffffff;
        --sage: #7c3aed; /* Primary Violet */
        --sage-light: #a78bfa; /* Lavender */
        --sage-dark: #4f46e5; /* Indigo */
        --terracotta: #d946ef; /* Fuchsia Accent */
        --terracotta-light: #f0abfc;
        --terracotta-dark: #a21caf;
        --charcoal: #1e1b4b; /* Midnight Indigo for text */
        --warm-gray: #71717a; 
        --light-gray: #ddd6fe; /* Soft Purple Border */
        --gold: #8b5cf6;
        --gold-light: #c4b5fd;
        --red-alert: #f43f5e;
        --green-ok: #10b981;
        --blue-info: #3b82f6;
        
        --card: 0 10px 25px -5px rgba(124, 58, 237, 0.12), 0 8px 10px -6px rgba(124, 58, 237, 0.1);
        --card-hover: 0 25px 35px -5px rgba(124, 58, 237, 0.25), 0 10px 15px -5px rgba(124, 58, 237, 0.15);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--cream);
        color: var(--charcoal);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4 {
        font-family: "Playfair Display", serif;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--cream);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, var(--sage-light), var(--sage));
        border-radius: 10px;
        border: 3px solid var(--cream);
      }

      /* Animations */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes pulse-glow {
        0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
        70% { box-shadow: 0 0 0 18px rgba(124, 58, 237, 0); }
        100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      .animate-fadeUp {
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-fadeIn {
        animation: fadeIn 0.6s ease forwards;
      }

      .animate-float {
        animation: float 4s ease-in-out infinite;
      }

      .animate-pulse-glow {
        animation: pulse-glow 2.5s infinite;
      }

      /* Print Styles */
      @media print {
        @page { margin: 1cm; }
        body { background: white !important; }
        .no-print { display: none !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
